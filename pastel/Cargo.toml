[package]
name = "pastel"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/iamkaf/palette"
readme = "README.md"
publish = false
description = "Run a Modrinth modpack as a managed dedicated Minecraft server."

[[bin]]
name = "pastel"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
flate2 = "1"
hex = "0.4"
quick-xml = { version = "0.38", features = ["serialize"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
tar = "0.4"
tempfile = "3"
toml = "0.8"
toml_edit = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["fs", "process", "signal"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
