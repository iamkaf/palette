[package]
name = "chalk"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/iamkaf/palette"
readme = "README.md"
publish = false
description = "Build and test Minecraft datapacks across Minecraft versions."

[[bin]]
name = "chalk"
path = "src/main.rs"

[dependencies]
palette-publish = { path = "../publish" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
