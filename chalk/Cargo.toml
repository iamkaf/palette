[package]
name = "chalk"
version = "0.1.0"
edition = "2024"
description = "Develop and test Minecraft datapacks across Minecraft versions"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
