[package]
name = "palette-publish"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/iamkaf/palette"
publish = false
description = "Prepare, verify, and publish Minecraft pack releases."

[lib]
name = "palette_publish"

[dependencies]
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
quick-xml = { version = "0.38", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
toml = "0.8"
