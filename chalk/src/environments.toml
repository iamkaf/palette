# The Minecraft versions Chalk tests datapacks on, newest first. Each one runs as a
# Fabric client connected to a Fabric dedicated server with the mods players commonly
# run, so a pack is proven in a production-shaped game.
fabric_loader = "0.19.5"

# The data pack format of every release a pack can name, from the first release with
# the singular `function` and `advancement` folders.
[releases]
"1.21" = [48, 0]
"1.21.1" = [48, 0]
"1.21.2" = [57, 0]
"1.21.3" = [57, 0]
"1.21.4" = [61, 0]
"1.21.5" = [71, 0]
"1.21.6" = [80, 0]
"1.21.7" = [81, 0]
"1.21.8" = [81, 0]
"1.21.9" = [88, 0]
"1.21.10" = [88, 0]
"1.21.11" = [94, 1]
"26.1" = [101, 1]
"26.1.1" = [101, 1]
"26.1.2" = [101, 1]
"26.2" = [107, 1]
"26.3" = [121, 0]

